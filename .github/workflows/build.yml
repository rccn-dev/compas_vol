name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 3.9 is the floor because it is what Rhino 8 embeds: if the suite
        # stops passing there, the Grasshopper components stop working, and
        # nothing else in CI would notice. 3.13 is the development version.
        python-version: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # The viewer extra pulls in PySide6, which cannot initialize on a
      # headless runner. Everything except the viewer is tested.
      - name: Install
        run: uv sync -p ${{ matrix.python-version }} --extra meshing --extra processes --group dev

      - name: Lint
        run: uv run -p ${{ matrix.python-version }} ruff check .

      - name: Test
        run: uv run -p ${{ matrix.python-version }} --extra meshing --extra processes python -m pytest

  # compas_vol stays general, but real work depends on it: every project in the
  # studio has to keep passing against this change, notebooks included.
  downstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: compas_vol

      - uses: actions/checkout@v4
        with:
          repository: rccn-dev/studio
          path: studio

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the studio, with this compas_vol
        working-directory: studio
        run: |
          uv sync --all-packages --locked
          uv pip install -e "../compas_vol[meshing,processes]"

      - name: Test every project
        working-directory: studio
        run: uv run --no-sync python -m pytest

      - name: Run every notebook
        working-directory: studio
        run: uv run --no-sync python scripts/run_notebooks.py

  # Proves the claim the package makes about itself: with nothing but compas
  # and numpy installed, importing it and building a tree still works, and
  # asking for anything more says which extra to install.
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the core only
        run: uv sync -p 3.9 --no-default-groups

      - name: A core-only install behaves as documented
        run: uv run -p 3.9 --no-default-groups python scripts/check_headless.py
