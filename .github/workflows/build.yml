name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # The viewer extra pulls in PySide6, which cannot initialize on a
      # headless runner. Everything except the viewer is tested.
      - name: Install
        run: uv sync --extra meshing --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run --extra meshing python -m pytest
